version: 2

updates:
  # Astro and anything else in package.json. Minor and patch bumps come in
  # one pull request; a major one gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions the workflows use, all in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
